services:
  web:
    build: app
    depends_on:
      - db
    ports: 
      - '8080:80'
      - '5173:${VITE_PORT:-5173}'
    volumes:
      - ./app:/var/www/html/

  db:
    image: mariadb:latest
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whatmovie
      MYSQL_USER: whatmovie
      MYSQL_PASSWORD: password

volumes:
  db_data:
