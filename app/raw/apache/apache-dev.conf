<Directory /var/www/html/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # RewriteEngine On

    # # Redirect to pages/home.php by default
    # RewriteRule ^$ pages/home.php [L]

    # # Serve pages from the pages directory
    # RewriteCond %{DOCUMENT_ROOT}/pages/$1.php -f
    # RewriteRule ^(.*)$ pages/$1.php [L,QSA]

    # # Fallback to index.php for other requests
    # RewriteRule ^(.*)$ index.php [L,QSA]
</Directory>

<Directory /errors/>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

Alias /_errors/ /errors/
ErrorDocument 404 /_errors/404.html
ErrorDocument 403 /_errors/403.html
ErrorDocument 500 /_errors/500.html
