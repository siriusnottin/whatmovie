<Directory /var/www/html/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On

    # /account auth routes
    RewriteCond %{REQUEST_URI} ^/(signin|signup|forgot-password)$
    RewriteRule ^/?(signin|signup|forgot-password)$ /pages/account/%1.php [L]

    # /account profile route
    RewriteCond %{REQUEST_URI} ^/account/?$
    RewriteRule ^/?account/?$ /index.php [L]
    
    # /account routes
    RewriteCond %{REQUEST_URI} ^/account/([a-zA-Z0-9_-]+)$
    RewriteRule ^/?account/([a-zA-Z0-9_-]+)$ /pages/account/%1.php [L]
    
    # /pages routes
    RewriteCond %{REQUEST_URI} ^/([a-zA-Z0-9_-]+)$
    RewriteRule ^/?([a-zA-Z0-9_-]+)$ /pages/%1.php [L]

    # Route root requests to home.php
    RewriteCond %{REQUEST_URI} ^/$
    RewriteRule ^/?$ /pages/home.php [L]
    
    # Block direct access to .php files, except through rewrite rules
    RewriteCond %{REQUEST_URI} !^/pages/.*\.php$ [NC]
    RewriteCond %{REQUEST_URI} \.php$ [NC]
    RewriteRule ^/?(.*\.php)$ - [F]

    # Ensure .htaccess and other sensitive files are not accessible
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

</Directory>

<Directory /var/www/html/public/uploads/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    # Restrict access to only static files
    <FilesMatch "\.(jpg|jpeg|png|gif|bmp|webp)$|.*">
        Require expr "%{REQUEST_URI} =~ /\.(jpg|jpeg|png|gif|bmp|webp)$/"
    </FilesMatch>
</Directory>

<Directory /errors/>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

Alias /_errors/ /errors/
ErrorDocument 404 /_errors/404.html
ErrorDocument 403 /_errors/403.html
ErrorDocument 500 /_errors/500.html
