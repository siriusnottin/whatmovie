<Directory /var/www/html/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On

    # Route all other requests to index.php
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L]

    # Ensure .htaccess and other sensitive files are not accessible
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

</Directory>

<Directory /var/www/html/public/uploads/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    # Restrict access to only static files
    <FilesMatch "\.(jpg|jpeg|png|gif|bmp|webp)$|.*">
        Require expr "%{REQUEST_URI} =~ /\.(jpg|jpeg|png|gif|bmp|webp)$/"
    </FilesMatch>
</Directory>

<Directory /errors/>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

Alias /_errors/ /var/www/html/pages/errors/
ErrorDocument 404 /_errors/404.php
ErrorDocument 403 /_errors/403.php
ErrorDocument 500 /_errors/500.php
